name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest
      - name: Demo (offline, no API key)
        run: python -m early_agi.demo
      - name: Offline A/B benchmark CLI
        run: python -m early_agi.bench --help
      - name: Demo (bounded-χ CLI selector)
        run: python -m early_agi.demo --backend bounded_chi --no-dotenv
      - name: Demo (EARLY_AGI_BACKEND selector)
        env:
          EARLY_AGI_BACKEND: bounded_chi
        run: python -m early_agi.demo --no-dotenv
      - name: Backend wiring and Gauge CLI smokes
        run: |
          python -c "from early_agi.config import Settings; s=Settings.from_env({'EARLY_AGI_BACKEND':'bounded_chi'}, load_dotenv=False); b=s.build_runtime('.'); assert b.kernel.backend.name == 'bounded_chi', b.kernel.backend.name; assert b.backend is b.kernel.backend"
          python -m early_agi.gauge run examples/netron_solve.gauge --root . --backend bounded_chi --compact --no-dotenv --output gauge-bounded-run.json
          python -c "import json; d=json.load(open('gauge-bounded-run.json', encoding='utf-8')); assert d['ok'], d['violations']; assert d['backend'] == 'bounded_chi', d; assert d['backend_impl'] == 'bounded_chi', d"
          python -m early_agi.gauge run examples/netron_solve.gauge --root . --backend thrml --compact --no-dotenv --output gauge-thrml-run.json
          python -c "import json; d=json.load(open('gauge-thrml-run.json', encoding='utf-8')); assert d['ok'], d['violations']; assert d['backend'] == 'thrml', d; assert d['backend_impl'] in ('thrml', 'thrml_informed'), d"
          python -c "import pathlib; t=pathlib.Path('pyproject.toml').read_text(encoding='utf-8'); assert ('thrml = [' + chr(34) + 'thrml>=0.1.4' + chr(34) + ']') in t"
      - name: Gauge frontend, IR, and VM
        run: |
          python -m early_agi.gauge check examples/netron_solve.gauge --compact --no-dotenv
          python -m early_agi.gauge compile examples/netron_solve.gauge --compact --no-dotenv > gauge-ir.json
          python -m early_agi.gauge run examples/netron_solve.gauge --root . --compact --no-dotenv --output gauge-run.json
          python -c "import json; d=json.load(open('gauge-run.json', encoding='utf-8')); assert d['ok'], d['violations']"
          python -m early_agi.gauge check examples/netron_plastic.gauge --compact --no-dotenv
          python -m early_agi.gauge run examples/netron_plastic.gauge --root . --compact --no-dotenv --output gauge-plastic-run.json
          python -c 'import json; d=json.load(open("gauge-plastic-run.json", encoding="utf-8")); assert d["ok"], d["violations"]; assert d["plasticity"]["enabled"], d; assert d["plasticity"]["probe"]["results"], d'

  race-hardening:
    name: WAL and worktree hardening / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Spawned WAL contention, migration, lineage and sandbox teardown
        run: python -m pytest -v tests/test_cold_sink_wal.py tests/test_branch_race.py tests/test_mera.py tests/test_gauge_race.py tests/test_ab_benchmark.py
      - name: Check public race example
        run: python -m early_agi.gauge check examples/netron_race.gauge --compact --no-dotenv

  lint:
    name: lint (ruff, pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned ruff
        run: python -m pip install "ruff==0.17.6"
      - name: Lint
        run: ruff check --output-format=github .
      - name: Format
        run: ruff format --check .

  verify:
    name: optional Z3 verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install verifier extra
        run: python -m pip install -e ".[dev,verify]"
      - name: Z3 is importable
        run: python -c "import z3; s=z3.Solver(); s.add(z3.Bool('x')); assert str(s.check()) == 'sat'"
      - name: Tests with verifier available
        run: python -m pytest

  package:
    name: package builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install build
          python -m build
      - name: Wheel contains py.typed and packaged Gauge program
        run: python -c "import zipfile,glob; z=zipfile.ZipFile(glob.glob('dist/*.whl')[0]); n=z.namelist(); assert any(p.endswith('py.typed') for p in n), n; assert 'early_agi/bench/netron_plastic.gauge' in n, n"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
