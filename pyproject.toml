[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "early-agi"
version = "0.2.0"
description = "Binary-orchestrated, physics-backend hybrid cognitive kernel (Phase 1 + Phase 2)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]
verify = ["ruff>=0.4", "z3-solver>=4.12"]

[project.scripts]
early-agi = "early_agi.demo:main"

[tool.setuptools.packages.find]
include = ["early_agi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
