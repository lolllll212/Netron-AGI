[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "early-agi"
dynamic = ["version"]
description = "Binary-orchestrated cognitive kernel with the Gauge thermodynamic orchestration language"
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "ai-agents",
    "cognitive-architecture",
    "mera",
    "gauge-language",
    "domain-specific-language",
    "tensor-networks",
    "verification",
    "sqlite",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff==0.17.6"]
verify = ["z3-solver>=4.12"]
# Optional adapter only. The bundled `thrml` backend seams use pure Python/NumPy.
thrml = ["thrml>=0.1.4"]

[project.scripts]
early-agi = "early_agi.demo:main"
gauge = "early_agi.gauge.cli:main"
early-agi-gauge = "early_agi.gauge.cli:main"

[project.urls]
Repository = "https://github.com/lolll212/Netron-AGI"
Issues = "https://github.com/lolll212/Netron-AGI/issues"

[tool.setuptools.dynamic]
version = { attr = "early_agi.__version__" }

[tool.setuptools.packages.find]
include = ["early_agi*"]

[tool.setuptools.package-data]
early_agi = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["early_agi", "tests"]

[tool.ruff.lint]
# Deliberately narrow: correctness, imports, modern syntax, and a few bugbears.
# Flake8-bandit/security and docstring rules are not enabled because the kernel
# executes verifiers by design (pytest, ruff, z3) and its prose is physics-heavy.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001", # ambiguous unicode in strings: η, χ, → are load-bearing here
    "RUF002", # ... and in docstrings
    "RUF003", # ... and in comments
]

[tool.ruff.lint.isort]
known-first-party = ["early_agi"]

[tool.ruff.format]
docstring-code-format = true
